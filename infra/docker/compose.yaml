name: ${COMPOSE_PROJECT_NAME:-tunner-local}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    environment:
      POSTGRES_DB: tunner
      POSTGRES_USER: tunner
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.6-management}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2}
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.7.0}
    user: "0"
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    volumes:
      - ../openbao/config:/openbao/config:ro
      - openbao-data:/openbao/file
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; code=$$?; test $$code -eq 0 -o $$code -eq 2 -o $$code -eq 3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.3}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE:-grafana/otel-lgtm:0.34.0}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - otel-lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-placeholder:
    profiles: ["app-placeholders"]
    image: ${PLACEHOLDER_IMAGE:-busybox:1.37.0}
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test -r /etc/os-release"]
      interval: 5s
      timeout: 3s
      retries: 3

  worker-placeholder:
    profiles: ["app-placeholders"]
    image: ${PLACEHOLDER_IMAGE:-busybox:1.37.0}
    command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test -r /etc/os-release"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
  rabbitmq-data:
  openbao-data:
  otel-lgtm-data:
