name: Create Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create a pull request when one is not already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          existing_pr="$(gh pr list --repo "$GH_REPO" --base main --head "$HEAD_REF" --state open --json url --jq '.[0].url')"
          if [ -n "$existing_pr" ]; then
            echo "An open pull request already exists: $existing_pr"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$HEAD_REF" --fill