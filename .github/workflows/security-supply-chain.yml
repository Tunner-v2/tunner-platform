name: Security Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore Tunner.Governance.sln
          dotnet restore Tunner.Platform.slnx
          dotnet restore tests/Tunner.Installer.Tests
          dotnet restore tests/Tunner.AuditRemediation.FunctionalTests
      - name: Build
        run: |
          dotnet build Tunner.Governance.sln --no-restore
          dotnet build Tunner.Platform.slnx --no-restore
          dotnet build tests/Tunner.Installer.Tests --no-restore
      - name: Governance functional checks
        run: dotnet run --project tests/Tunner.Governance.FunctionalTests --no-restore
      - name: Platform and installer tests
        env:
          TUNNER_RUN_CONTAINER_TESTS: "1"
        run: |
          dotnet test Tunner.Platform.slnx --no-build --no-restore --logger trx --results-directory artifacts/ci-tests/platform
          dotnet test tests/Tunner.Installer.Tests --no-build --no-restore --logger trx --results-directory artifacts/ci-tests/installer
          dotnet run --project tests/Tunner.Observability.FunctionalTests --no-build --no-restore
          dotnet run --project tests/Tunner.AuditRemediation.FunctionalTests --no-restore
      - name: Global UI route form and fidelity evidence gate
        run: dotnet run --project src/Tunner.Governance --no-build --no-restore -- governance ui check
      - name: Required-check enforcement regression
        shell: pwsh
        run: ./tools/validation/Test-TunnerCiEnforcement.ps1
      - name: Static security baseline validation
        shell: pwsh
        run: ./tools/validation/Validate-TunnerSecuritySupplyChainSource.ps1 -RepositoryRoot $PWD
      - name: Run local security and supply-chain baseline
        shell: pwsh
        run: ./tools/security/Invoke-TunnerSecurityBaseline.ps1 -RepositoryRoot $PWD -AsOf ([DateTime]::UtcNow.ToString('yyyy-MM-dd'))
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: |
            artifacts/supply-chain/
            artifacts/ci-tests/
          if-no-files-found: error
          retention-days: 14

  container-image-scan:
    name: Container image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:18.6
          - image: rabbitmq:4.3.6-management
          - image: redis:8.10.2
          - image: openbao/openbao:2.7.0
          - image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
          - image: grafana/otel-lgtm:0.34.0
          - image: busybox:1.37.0
          - image: tunner-security/postgres:18.6-r1
            component: postgres
          - image: tunner-security/openbao:2.7.1-r1
            component: openbao
          - image: tunner-security/mailpit:1.31.6-r1
            component: mailpit
    steps:
      - name: Checkout candidate build source
        if: matrix.component != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build private maintained candidate
        if: matrix.component != ''
        shell: pwsh
        env:
          BUILD_COMPONENT: ${{ matrix.component }}
        run: ./tools/security/Build-TunnerSecurityImages.ps1 -Component $env:BUILD_COMPONENT
      - name: Candidate compatibility checks
        if: matrix.component != ''
        shell: pwsh
        env:
          BUILD_COMPONENT: ${{ matrix.component }}
        run: |
          $catalog = Get-Content infra/security-images/catalog.json -Raw | ConvertFrom-Json
          $entry = $catalog.images | Where-Object component -eq $env:BUILD_COMPONENT
          & ('./' + $entry.compatibility_test) -Image $entry.image
      - name: Scan declared public image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Retain private build provenance
        if: always() && matrix.component != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-image-${{ matrix.component }}-${{ github.sha }}
          path: artifacts/security-images/
          if-no-files-found: error
          retention-days: 14

  container-security-gate:
    name: Container security gate
    if: ${{ always() }}
    needs: [container-image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enforcement helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require all declared image scans to succeed
        shell: pwsh
        env:
          IMAGE_SCAN_RESULT: ${{ needs.container-image-scan.result }}
        run: ./tools/security/Assert-TunnerCiResult.ps1 -Result $env:IMAGE_SCAN_RESULT
  web-validation:
    name: Web build tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the repository-pinned pnpm
        run: corepack enable
      - name: Install locked frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build and test shared UI
        working-directory: web
        run: |
          pnpm build
          pnpm test
          pnpm exec playwright install --with-deps msedge
          pnpm test:browser
      - name: Frontend dependency audit
        working-directory: web
        run: pnpm audit --json > test-results/dependency-audit.json
      - name: Retain browser and dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-validation-${{ github.sha }}
          path: web/test-results/
          if-no-files-found: error
          retention-days: 14
