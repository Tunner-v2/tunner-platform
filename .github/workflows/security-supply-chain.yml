name: Security Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Tunner.Governance.sln
      - name: Build
        run: dotnet build Tunner.Governance.sln --no-restore
      - name: Governance functional checks
        run: dotnet run --project tests/Tunner.Governance.FunctionalTests --no-restore
      - name: Static security baseline validation
        shell: pwsh
        run: ./tools/validation/Validate-TunnerSecuritySupplyChainSource.ps1 -RepositoryRoot $PWD
      - name: Run local security and supply-chain baseline
        shell: pwsh
        run: ./tools/security/Invoke-TunnerSecurityBaseline.ps1 -RepositoryRoot $PWD -AsOf ([DateTime]::UtcNow.ToString('yyyy-MM-dd'))
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 14

  container-image-scan:
    name: Container image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:18.6
          - rabbitmq:4.3.6-management
          - redis:8.10.2
          - openbao/openbao:2.7.0
          - axllent/mailpit:v1.31.3
          - grafana/otel-lgtm:0.34.0
          - busybox:1.37.0
    steps:
      - name: Scan declared public image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table