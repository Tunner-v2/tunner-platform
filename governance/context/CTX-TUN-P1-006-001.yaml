exclusion_reasons:
  Product/domain event catalog, owner-domain event creation, business handlers, public event contracts, and Connected Product broker access: P1-006 consumes only the existing generic committed outbox envelope and must not create Product or external integration authority.
  consumer inbox/idempotency, durable work, retry scheduling, redrive/replay semantics, or long-lived timer behavior: ADR-0001 identifies them as separate durable mechanics; TUN-P1-007 owns the inbox/durable-work/retry capability.
  queue-per-customer/work-item topology, domain-specific exchanges or bindings, and arbitrary workload semantics: topology must remain a bounded internal foundation and cannot encode unapproved owner-domain scaling or delivery behavior.
  user/admin UI, BFF, public API/SDK, identity, OAuth/OIDC, authorization, provider, financial, and commercial behavior: none are required for post-commit internal transport and their authority remains separately governed.
  production deployment, broker credentials, secret values, environment-specific hosts, and fixed host ports: P1-006 is local/repository-portable; secret delivery and production operations remain separate governed scopes.
