  Product/user/admin workflow semantics, Connected Product contracts, public API/SDK behavior, financial, KYC, payment, provider, compliance, commercial, audit, and owner-domain semantics: The foundation may not create business authority or Connected Product behavior.
  User/Admin BFF host exposure, browser client UX, reconnect timing, stateful replay/retention, identity/session implementation, and domain resource-policy definitions: These are owned by the applicable BFF, identity, and domain work items. The foundation supplies mandatory technical hooks only.
  Domain-specific realtime categories, domain payloads, Product/account/resource subscription inputs, and Product-facing SignalR: The authority permits only a reusable typed non-authoritative mechanism at this stage.
  Redis topology/backplane configuration, deployment, environment credentials, release, and production operations: Redis is an optional non-authoritative scale-out backplane only when a multi-node Tunner web deployment requires it.
