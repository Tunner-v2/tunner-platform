exclusion_reasons:
  owner-domain work types, payload semantics, business timers, workflows, state transitions, retry policy values, and handler dispatch: P1-007 owns only generic durable mechanics; owner domains retain all business meaning and retry safety decisions.
  Product event contracts, user/admin UI, BFF, public API/SDK, identity, OAuth/OIDC, authorization, provider, financial, compliance, and commercial behavior: no Product authority is needed to establish the technical persistence boundary and none may be inferred.
  RabbitMQ queue/binding configuration, consumer runtime registration, redrive policy, Connected Product broker access, and broker authority: ADR-0001 makes PostgreSQL the durable authority and requires later governed topology/consumer scopes for concrete transport behavior.
  runtime configuration, credentials, secret values, environment-specific hosts, fixed ports, deployment, release, and production operations: P1-007 is repository-portable technical foundation work only.
