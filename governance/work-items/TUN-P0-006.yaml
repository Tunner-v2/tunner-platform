acceptance_criteria:
  - Docker Compose defines the local dependency topology: PostgreSQL 18, RabbitMQ 4.3 management, Redis 8.x, OpenBao, Mailpit, and Grafana OTEL-LGTM (which includes an OpenTelemetry Collector), with API and Worker health placeholders isolated behind an opt-in profile.
  - All image references are exact version tags selected from current primary-source evidence; no latest or edge tag is used.
  - All published local ports bind to loopback by default and remain configurable without code changes.
  - The repository contains no credential, secret, or permanent OpenBao root token. OpenBao starts in its documented sealed or uninitialized state; P0-007 owns initialization, policy, and application secret injection.
  - The repository provides a documented tunner-dev-compatible PowerShell entry point for doctor, setup, start, stop, health, and logs. Its start command needs no manual dependency installation after Docker Desktop prerequisites are present.
  - Static Compose configuration and source contracts pass without pulling images or starting long-lived containers. Runtime start and dependency-health acceptance are explicitly deferred to a user-run, local-environment validation.
  - No object-store emulator, R2 credential, Product behavior, API implementation, Worker implementation, or production deployment claim is introduced.
prerequisites:
