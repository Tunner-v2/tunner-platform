acceptance_criteria:
  - A reusable .NET observability foundation uses OpenTelemetry/OTLP for traces, metrics, and logs without application-provider coupling.
  - Correlation is available through safe request or operation context, trace context, and causation context where supplied; Product and environment identifiers are included only when explicitly safe and non-sensitive.
  - Telemetry attributes and exception/log enrichment prevent secrets, raw payment data, and unrestricted PII from entering the exported baseline.
  - Development/test export is configurable to the existing loopback-only Grafana OTEL-LGTM collector; the application contract remains backend-neutral and does not select a production backend.
  - Deterministic validation proves resource identity, correlation propagation, redaction behavior, and the local exporter configuration boundary without starting containers or requiring a Product application.
  - No Product/business metrics, usage/billing telemetry, production observability provider, deployment claim, credential, API, Worker, or UI behavior is introduced.
