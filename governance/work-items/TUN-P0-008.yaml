acceptance_criteria:
  - EF Core 10 and Npgsql 10-compatible PostgreSQL migration tooling is defined without Product/domain schema behavior.
  - Migration ownership, forward-only history, and production application-startup boundaries are documented and enforced by the P0 foundation.
  - A credential-free local migration rehearsal path is documented; any long-running database operation remains operator-run.
  - Product tables, business semantics, production deployment, and production credentials remain out of scope.
