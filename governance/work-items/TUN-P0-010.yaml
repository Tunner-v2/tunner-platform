acceptance_criteria:
  - A repository-wide .NET unit-test standard is centrally versioned and runs through a deterministic command.
  - A Testcontainers baseline is opt-in, uses throwaway containers with random host bindings, and never starts a container or uses committed credentials by default.
  - A contract-test directory is present with explicit placeholders and no invented API, event, webhook, or Product contract.
  - A Playwright .NET skeleton is present, defaults to no browser interaction, and documents the explicit operator browser-install and execution path for later UI-authorized work.
  - An environment-test command selects unit, integration, browser, or full local profiles without mixing environments, starting Docker unexpectedly, or making production claims.
  - No Product API, Worker, persistence, UI behavior, contract semantics, production test, credential, or deployment configuration is introduced.
