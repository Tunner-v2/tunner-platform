acceptance_criteria:
  - Provide a deterministic local security baseline covering source-policy SAST, NuGet dependency vulnerability inspection, the existing repository secret scan, and Compose-definition policy checks.
  - Generate a deterministic SPDX 2.3-compatible package inventory and a non-release checksum/provenance record from restored local dependency metadata.
  - Add a read-only GitHub Actions workflow that runs the local baseline and immutable-pinned container image vulnerability scans for the declared local Compose images.
  - Retain generated reports only as disposable local or CI artifacts; do not upload a release, publish an attestation, request deployment credentials, or claim production/release approval.
  - Fail local checks for reported NuGet vulnerabilities, static source-policy findings, secret findings, unsafe Compose definitions, malformed generated evidence, or invalid output boundaries.
  - Provide static and executable validation, role-review evidence, current R&D source evidence, governance validation, authority verification, and fresh context.
