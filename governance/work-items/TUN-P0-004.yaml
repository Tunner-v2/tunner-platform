acceptance_criteria:
  - 'A separate .NET 10/C# 14 repository-native tooling solution exposes the `tunner governance` command group.'
  - '`validate` reports malformed governance YAML with file and location, verifies required record fields, and validates supported record shapes against the versioned schema contract.'
  - '`status` deterministically reports milestones, work-item states, blockers, prerequisites, and evidence readiness without mutating repository records.'
  - '`next` lists eligible work items and explains every ineligible item from prerequisite, blocker, or required-evidence facts.'
  - '`gate check <work-item>` rejects DONE readiness when required evidence, activated-role review evidence, blockers, or prerequisites are incomplete.'
  - 'Invalid lifecycle transitions are rejected deterministically; the MVP is read-only and cannot mutate Product data or governance records.'
  - 'Tooling source, static checks, role reviews, and environment limitations are recorded as evidence.'
  - '`next` separately reports genuine human protected-main integration actions while preserving agent-executable local/branch work.'
  - 'Declared dependencies enforce LOCAL_VALIDATED or MERGED_TO_MAIN readiness; merged-main readiness requires explicit merge evidence.'
  - 'Configured dependency-chain and concurrent-unmerged limits block only additional dependent local chains; null leaves no unapproved project cap.'
