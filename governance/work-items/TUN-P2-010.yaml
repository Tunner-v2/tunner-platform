  "acceptance_criteria": [
    "Normalize provider plus immutable subject into Tunner-owned links; never link solely because emails match.",
    "Require existing-Account authentication/recovery for verified-email collision and explicit confirmed link flows.",
    "Prevent unlinking the last policy-required authentication/recovery path; provider email changes do not rewrite identity keys.",
    "Qualified provider-verified-contact registration reuses explicit Tunner notice consent, existing Personal Information, age-aware eligibility and activation; no fabricated password, automatic email linking, pending-Account adoption or session issuance. Missing provider-verified-contact capability remains unavailable."
  ],
