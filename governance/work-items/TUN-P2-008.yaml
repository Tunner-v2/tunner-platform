  "acceptance_criteria": [
    "Keep TOTP enrollment inactive until the first valid verification code.",
    "Protect seed material and require approved step-up/policy for enable/disable/reset; do not expose seeds to Admin/Support.",
    "Preserve operation identity and audit evidence without storing secrets in logs/events.",
    "Verify active TOTP through the existing shared exact-operation proof lifecycle; adding a primary method or setup screen alone does not satisfy this requirement.",
    "Integrate policy-required TOTP second-factor completion after primary proof and before issuing a qualifying final Tunner session. Enrollment alone never imposes MFA for every login, and TOTP is not a standalone primary method.",
    "Enforce one-time seed/QR disclosure, inactive first-code enrollment, exact original result recovery and no secret in configuration, Identity tables, URLs, logs, events or evidence.",
    "Keep configured cardinality, session effects, replacement ordering, retention, assurance and provider binding explicit; reject unsupported/unapproved profiles without production defaults."
  ],
