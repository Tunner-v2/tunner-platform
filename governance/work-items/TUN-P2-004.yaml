  "acceptance_criteria": [
    "Register with email/password/confirmation and current terms/privacy acknowledgement, without DOB or age rejection; verify contact before normal Personal Information.",
    "Personal Information collects DOB using shared calendar-safe server evaluation; age below18 does not itself deny Account activation, normal authentication/session or ordinary Product relationship.",
    "Resolve current jurisdiction-scoped age/consent policy and trusted consent evidence; independent payer/payment-method/paid-term capabilities remain restricted under18, while existing BillingAuthority/sponsorship contracts own paid access.",
