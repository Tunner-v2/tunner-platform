acceptance_criteria:
  - Implement only authority-backed post-commit delivery/consumer topology consuming the transactional outbox: pending rows are dispatched only after commit and are marked published only after a RabbitMQ publisher confirm; no Product event, inbox, durable-work, provider, or business-state behavior.
  - Use the official RabbitMQ.Client package family and the accepted RabbitMQ outbox/inbox decision; preserve at-least-once delivery and keep RabbitMQ non-authoritative.
  - Reuse or extend a compatible existing capability when one exists; do not add a generic Common, Utils, Helpers, or shared-everything layer.
  - Preserve domain/business semantics as owner concerns and keep technical canonicalization and presentation formatting non-authoritative.
  - Do not infer Product behavior, user flows, commercial rules, policy values, or public contract semantics beyond cited authority.
