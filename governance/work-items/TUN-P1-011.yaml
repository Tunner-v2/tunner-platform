acceptance_criteria:
  - Audit current authorized Tunner capabilities and runtime components for a material Tunner-owned browser gRPC-Web need or a justified separate-process native-gRPC boundary.
  - Confirm and preserve the selected defaults: browser commands/queries use BFF REST/JSON, browser realtime uses SignalR, Connected Products use REST/OpenAPI plus signed webhooks/events, and same-process modules use typed in-process contracts.
  - When no selective activation trigger is present, record NOT_PRESENT and add no Grpc.* package, .proto file, gRPC/gRPC-Web endpoint, generated client, or generic scaffolding.
  - Preserve the future activation trigger: a feature/capability-specific ADR is required before gRPC-Web, and a justified process/service-boundary ADR is required before native gRPC.
  - Validate that gRPC absence is deliberate policy conformance rather than an untracked missing contract, and that ordinary capability remains on its canonical transport.
  - Reuse or extend a compatible existing capability when one exists; do not add a generic Common, Utils, Helpers, or shared-everything layer.
  - Do not infer Product behavior, user flows, commercial rules, policy values, public contract semantics, or a gRPC adoption decision beyond cited authority.
