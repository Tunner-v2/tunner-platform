  "acceptance_criteria": [
    "Collect non-secret engineering R2 configuration and exact operator-provided secret references during installer setup; store no credentials or bootstrap token in the profile.",
    "Resolve credentials through a provider-neutral secret-store abstraction and OpenBao KV v2 using a scoped finite-lifetime token; reject root tokens and credential disclosure.",
    "Reuse the existing R2 adapter; provide a dedicated non-production contract runner with bounded unique-object cleanup. Do not mark live R2 acceptance passed without actual authorized execution.",
    "Validate installation, secret transport, failure handling and cleanup with meaningful deterministic and disposable OpenBao integration tests; commit owned changes and record tested SHA.",
    "Preserve closed work and historical evidence; P1-023 and milestone acceptance remain blocked until live R2 evidence exists."
  ],
