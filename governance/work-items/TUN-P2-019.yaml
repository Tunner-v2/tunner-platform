  "acceptance_criteria": [
    "Provide the documented PresentationContent-owned semantic keys, allowlisted variants, immutable versions/publications/proposals and deterministic effective resolution/fallback for active P2 surfaces. Reuse existing policy, outbox, audit and shared UI capabilities; no separate deployable or cross-domain writable repository.",
    "Provide secure role-authorized guided contextual draft/preview/validation/diff/required approval/publish/history/rollback workflows. AI output remains draft. Sensitive text and security configuration require explicit approval provenance and configured separation of duties; presentation editing never changes domain behavior.",
    "Persist and administer approved Identity runtime configuration through domain-owned typed validation, immutable version/effective-scope selection and audit, without inventing policy/retention/legal values or exposing secrets. Keep production enablement blocked until required owners supply approved configuration.",
    "Replace synthetic test publication at production composition boundaries with the governed resolver. Retain explicitly isolated local test fixtures. Verify production-oriented audience copy, strict authorization/bypass/concurrency tests and current Figma/routing/form/accessibility/performance evidence before acceptance."
  ],
