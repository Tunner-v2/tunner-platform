acceptance_criteria:
  - Establish only Tunner User/Admin browser realtime technical foundations; no Connected Product SignalR contract or Product-facing SignalR behavior is introduced.
  - REST/BFF/read models remain authoritative for commands, queries, permissions, and current state. Realtime carries only typed minimal resynchronization hints and never full authoritative domain objects.
  - The reusable adapter requires authenticated policy access, has no client-supplied subscription method, and derives every audience membership server-side through the authenticated Tunner scope resolver.
  - A reconnecting browser must re-establish authorized realtime scope and resynchronize affected authoritative state through BFF/API/read-model reads; missed, duplicate, stale, reordered, or unavailable realtime delivery cannot corrupt authoritative state.
  - The adapter prevents sensitive identity, security, KYC, payment, financial, provider, or Product details from its foundation hint shape and telemetry.
  - The adapter provides connection-level policy hooks for browser origin and rate/resource protection. Identity/session owners retain authoritative invalidation and reauthorization responsibility.
  - Redis remains unconfigured at this slice and may be used only as a non-authoritative SignalR backplane when multiple Tunner web nodes require it.
  - Do not define domain-specific realtime event categories, domain payloads, client reconnect timing, retention/replay behavior, Product behavior, or resource-policy semantics in this technical foundation.
