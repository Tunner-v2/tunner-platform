acceptance_criteria:
  - 'The unified `tunner context build --work-item <id>` command generates a bounded, manifest-first context pack for a governed work item.'
  - 'The generated pack identifies the current task, authority references, open blockers, relevant flows/contracts/decisions, required tests/evidence, activated role skills, and bounded relevant Git history.'
  - 'The pack records included and excluded artifacts with reasons, source SHA-256 hashes, generation metadata, and explicit no-context findings instead of guessing.'
  - '`tunner context verify` detects a missing or changed included source and reports STALE without treating generated output as authority.'
  - 'The context builder writes only the documented generated context pack and does not mutate Product data or governance records.'
