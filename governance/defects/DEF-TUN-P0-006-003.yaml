environment: local PowerShell Docker Compose wrapper
description: Docker Compose emits normal progress/status lines on native stderr with exit code zero. Direct PowerShell invocation can promote those lines to NativeCommandError under strict error handling. The wrapper now invokes Docker through the .NET process API, captures and replays both output streams, and determines success exclusively from Docker exit code across PowerShell versions.
