schema_version: 1
milestone_id: P1
title: Platform Foundation
status: ACTIVE
goal: Establish the authority-backed platform foundation for later Tunner Product planes while keeping Product/domain semantics, user workflows, and unresolved decisions out of implementation.
scope:
  - API and Worker composition
  - module bootstrap conventions
  - persistence, transactional outbox/inbox, durable work, and retry mechanics
  - RabbitMQ, Redis, object storage, SignalR, and selective gRPC foundation contracts
  - authentication/authorization primitives, policy resolution, audit append, provider adapter, environment model, problem standard, and contract publishing pipeline
non_goals:
  - Account or Identity Product behavior
  - user/admin production workflows
  - payment, billing, provider-finality, or Finance-domain behavior
  - implementation of any P1 foundation capability before governed refinement identifies its authoritative boundary and acceptance evidence
authority_refs:
  - docs/authority/current-authority.json
  - docs/authority/amendments/AMD-0001/effective-overrides/11_Development_Planes_Milestones_and_P0_Backlog.md
  - docs/authority/baselines/1.6.0/01_Engineering_Technology_Foundation.md
  - docs/authority/baselines/1.6.0/02_Repository_Solution_and_Module_Architecture.md
  - docs/authority/baselines/1.6.0/15_Runtime_Communication_and_Infrastructure_Technology_Scope.md
prerequisites: [P0]
work_items: [TUN-P1-001, TUN-P1-002, TUN-P1-003]
required_gates: []
required_roles: [project-manager, solution-architect, governance-engineer, tester-qa-engineer, auditor]
evidence_refs: [governance/evidence/P0-DEEP-AUDIT-20261001.json, governance/evidence/TUN-P1-001-VALIDATION.json, governance/evidence/TUN-P1-002-VALIDATION.json]
known_risks:
  - P1 headline backlog does not itself authorize invented Product semantics or an arbitrary implementation order.
  - Any missing acceptance boundary, domain owner, or Product decision must become a governed blocker or decision request.
