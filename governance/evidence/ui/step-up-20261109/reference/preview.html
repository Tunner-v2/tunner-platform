<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2-006 visual proposal — draft</title>
<style>@font-face{font-family:Inter;src:url("../../../../../web/packages/ui/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;color:#0f172a;background:rgba(255,255,255,.72)}
.stage{min-height:100svh;position:relative;padding:300px 16px 80px}.card{width:500px;min-height:410px;margin:auto;padding:27px;background:#fff;border:1px solid #dbe3f0;border-radius:18px;box-shadow:0 14px 30px #0000001f}h1{font-size:28px;font-weight:600;margin:0 0 14px;line-height:34px}.intro{font-size:14px;line-height:17px;color:#4d5e78;margin:0 0 34px}
.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;position:relative;min-height:64px;padding:12px 17px;background:#fff;border:1px solid #dbe3f0;border-radius:12px;color:#0f172a;font:600 15px Inter;cursor:pointer}.choice small{display:block;margin-top:6px;font-size:12px;font-weight:400;color:#4d5e78}.arrow{position:absolute;right:16px;top:18px;font-size:24px;color:#4f40eb;line-height:24px}.choice.other{min-height:56px;font-size:14px}.choice.other .arrow{top:14px}.choice:disabled{color:#616975;cursor:default}.choice:disabled small{color:#616975}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:16px;flex-wrap:wrap}.actions button{min-width:100px;min-height:40px;padding:9px 16px;border:1px solid #dbe3f0;border-radius:10px;background:#fff;color:#0f172a;font:600 13px Inter;cursor:pointer}.actions .primary{color:#fff;background:#4f46e5;border-color:#4f46e5}.actions button:disabled{opacity:.65;cursor:default}
label{display:block;font-size:13px;font-weight:600;line-height:17px;margin-bottom:8px}input{display:block;width:100%;height:44px;padding:0 14px;border:1px solid #616975;border-radius:8px;font:14px Inter;color:#0f172a;background:#fff}input::placeholder{color:#616975}.field-error,.summary{color:#b91c1c;font-size:13px;line-height:18px;margin:8px 0 0}.summary{font-size:14px;font-weight:600;margin-top:16px}input[aria-invalid=true]{border:2px solid #b91c1c}.password .actions{margin-top:28px}.status{color:#475569;line-height:22px;margin-top:18px}button:focus-visible,input:focus-visible{outline:2px solid #4f46e5;outline-offset:3px}.notice{border-radius:12px;background:#f1f5f9;color:#475569;padding:16px;line-height:22px}.password .intro{margin-bottom:28px}
@media(max-width:600px){.stage{display:flex;align-items:center;padding:24px 16px;min-height:100svh}.card{width:100%;max-width:500px;padding:24px;min-height:410px}h1{font-size:27px}.choice{padding-right:40px}.actions{gap:8px}.actions button{min-width:88px}.intro{line-height:20px}}
</style><main class="stage"><section class="card" id="card"></section></main>
<script>
const state=new URLSearchParams(location.search).get('state')||'chooser';
const heading='<h1>Confirm it’s you</h1>';
const cancel='<button type="button" onclick="window.parent.postMessage({reviewCancel:true},\'*\')">Cancel</button>';
const card=document.getElementById('card');
if(state==='chooser'){card.innerHTML=heading+'<p class="intro">For your security, verify your identity before continuing.</p><div class="choices"><button class="choice" disabled title="Not available yet">Passkey<small>Use this device or a security key</small><span class="arrow" aria-hidden="true">›</span></button><button class="choice" disabled title="Not available yet">Authenticator<small>Enter a 6-digit code</small><span class="arrow" aria-hidden="true">›</span></button><button class="choice other" onclick="location.search=\'?state=password\'">Other method<span class="arrow" aria-hidden="true">›</span></button></div><div class="actions">'+cancel+'</div>';}
else{card.classList.add('password');card.innerHTML=heading+'<p class="intro">Enter your password to continue.</p>'+
(state==='expired'?'<div class="notice">Your session or this request changed. Return to the action and try again.</div><div class="actions">'+cancel+'</div>':
'<form onsubmit="event.preventDefault();location.search=\'?state=error\'"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="off" placeholder="Enter your password" '+(state==='error'?'aria-invalid="true" aria-describedby="password-error"':'')+(state==='pending'?' disabled':'')+'>'+
(state==='error'?'<p id="password-error" class="field-error">We couldn’t verify your identity. Check your password and try again.</p><p class="summary" role="alert">Please check the highlighted field.</p>':'')+
'<div class="actions"><button type="button" onclick="location.search=\'?state=chooser\'" '+(state==='pending'?'disabled':'')+'>Back</button><button type="button" '+(state==='pending'?'disabled':'')+'>Cancel</button><button class="primary" type="submit" '+(state==='pending'?'disabled':'')+'>Confirm</button></div>'+(state==='pending'?'<p class="status" role="status">Please wait…</p>':'')+'</form>');}
</script>
