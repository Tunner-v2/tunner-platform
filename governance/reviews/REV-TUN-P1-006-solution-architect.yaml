findings:
  - The database capability reads only committed outbox records and conditionally records the confirmed publication timestamp; it does not mutate owner-domain state.
  - The Worker references Database through an explicit outbox transport projection and owns RabbitMQ.Client use, keeping persistence and transport responsibilities separated.
  - The only broker topology is a durable internal topic exchange. Queues, bindings, consumers, inboxes, retry/redrive, and workload semantics remain excluded and owned by TUN-P1-007 or later approved work.
  - Reusing one channel behind a SemaphoreSlim obeys the client concurrency requirement without promoting a broker abstraction into a generic platform library.
