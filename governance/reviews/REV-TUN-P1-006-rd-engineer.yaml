findings:
  - Current primary RabbitMQ documentation supports the official RabbitMQ.Client 7.x IConnection and IChannel API, long-lived connections and channels, publisher confirmations, and publisher-side mutual exclusion for a shared channel.
  - RabbitMQ.Client v7 confirmation tracking makes BasicPublishAsync fail for a broker nack or a mandatory-message return, which makes awaiting the call a suitable bounded confirmation boundary.
  - RabbitMQ.Client 7.2.1 is centrally versioned; changing the major version or expanding delivery topology requires refreshed source evidence and governance review.
