findings:
  - The coordinator has only a technical persistence boundary and a confirmed publisher boundary; it does not expose a general database context or Product/domain behavior.
  - A message is marked published only after PublishConfirmedAsync returns; publisher failures, including tracked broker nacks or mandatory-message returns, leave the row pending.
  - A confirmed publish followed by a failed mark can be delivered again, which preserves at-least-once transport and deliberately defers consumer idempotency to TUN-P1-007.
  - No generic Common, Utils, Helpers, or new shared-everything library is introduced.
