schema_version: 1
policy_id: git-and-contribution-policy
status: ACTIVE
scope: repository
main_branch:
  name: main
  direct_push: prohibited
  force_push: prohibited
  deletion: prohibited
branching:
  strategy: protected-trunk-based-development
  branches: short_lived
  allowed_prefixes: [feat, fix, change, hotfix, docs]
  pattern: "<prefix>/TUN-<work-item-number>-<short-description>"
  temporary_exceptions:
    - decision_id: DEC-0002
      branch: change/TUN-P0-control-plane
      scope: P0 governance and development-system work only
      expires_when: P0 final protected pull request is merged or the temporary branch is closed
      rationale: Keep P0 locally integrated and evidence-bearing while allowing protected incremental pull requests for locally validated slices.
commit:
  cohesive: true
  buildable_when_practical: true
  recommended_format: "<type>(<scope>): <summary>"
  traceability_trailers: [Work-Item, Milestone, Authority]
pull_request:
  required_for_main: true
  required_metadata: [work_item, authority_impact, verification_evidence]
  required_codeowner_review: true
  auto_merge: permitted_after_protected_requirements
  approval_pending: continues_governance_eligible_local_and_branch_execution
  integration_gate: protected_main_merge_requires_human_approval
  dependency_readiness: [LOCAL_VALIDATED, MERGED_TO_MAIN]
  automation:
    create_on_non_main_push: true
    enable_auto_merge_on_non_main_push: true
security:
  prohibit_committed_secrets: true
  require_sensitive_area_review: true
evidence:
  required_for_done: true
  user_run_checks_must_be_recorded: true